spring.application.name=clipbarber-backend

# Configuracion de la conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/clipbarber_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=barber_user
spring.datasource.password=barber_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT Configuration
jwt.secret=d2ViYmVyYmFja2VuZFNlY3JldEtleUZvckpXVFRva2VuR2VuZXJhdGlvbjIwMjQ=
jwt.expiration=86400000

# Swagger Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
