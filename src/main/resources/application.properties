spring.application.name=clipbarber-backend

# Configuracion de la conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/clipbarber_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=barber_user
spring.datasource.password=barber_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

