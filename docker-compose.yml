version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: clipbarber_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: clipbarber_db
      MYSQL_USER: barber_user
      MYSQL_PASSWORD: barber_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: